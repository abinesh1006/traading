[project]
name = "niftyquant"
version = "0.1.0"
description = "Nifty quant research: data ingestion, features, models"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "pyarrow>=16",
    "scipy>=1.13",
    "requests>=2.32",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]
# Live view (live.py): what the Fyers SDK's data WebSocket imports. The SDK itself is installed
# without its dependencies, because it hard-pins requests 2.31, aiohttp 3.9.3 and the obsolete
# asyncio backport, which would break this environment:
#   uv pip install -e ".[live]"  &&  uv pip install --no-deps fyers-apiv3==3.2.1
live = ["websocket-client>=1.8", "aws-lambda-powertools>=3", "setuptools<81"]

[project.scripts]
niftyquant = "niftyquant.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
