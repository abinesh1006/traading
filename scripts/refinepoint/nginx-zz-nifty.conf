# Copy of /etc/nginx/sites-available/zz-nifty.conf on the RefinePoint server (enabled via sites-enabled).
# Cert: certbot certonly --webroot -w /var/www/nifty-acme -d nifty.161.153.47.217.sslip.io (auto-renews).
# Login: /etc/nginx/nifty.htpasswd (user nifty; password in the PC's .env as NIFTY_WEB_PASSWORD).
# Nifty Quant dashboard. App: ~ubuntu/niftyquant (scripts/refinepoint/server.sh), backend on 127.0.0.1:18088.
# Public over HTTPS, behind basic auth (/etc/nginx/nifty.htpasswd): the app itself has no login.
server {
    listen 443 ssl;
    server_name nifty.161.153.47.217.sslip.io;

    ssl_certificate /etc/letsencrypt/live/nifty.161.153.47.217.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nifty.161.153.47.217.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;

    auth_basic "Nifty Quant";
    auth_basic_user_file /etc/nginx/nifty.htpasswd;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=15552000" always;

    location / {
        proxy_pass http://127.0.0.1:18088;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
server {
    listen 80;
    server_name nifty.161.153.47.217.sslip.io;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/nifty-acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
